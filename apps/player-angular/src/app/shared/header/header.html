<header class="
        sticky
        top-0
        z-50
        border-b
        backdrop-blur-xl
    " style="
        background: color-mix(
            in srgb,
            var(--color-surface) 92%,
            transparent
        );
        border-color: var(--color-border);
    ">

    <div class="
            mx-auto
            flex
            h-16
            max-w-7xl
            items-center
            justify-between
            px-4
            lg:px-8
        ">
        <a routerLink="/player" class="
                flex
                items-center
                gap-3
                font-black
                text-xl
            " style="color: var(--color-text)">
            <div class="
                    flex
                    h-10
                    w-10
                    items-center
                    justify-center
                    rounded-xl
                " style="
                    background:
                    var(--color-primary);

                    color: white;
                ">
                Q
            </div>
            QuizHub
        </a>

        <!-- Desktop Navigation -->
        <nav class="
                hidden
                items-center
                gap-8
                md:flex
            ">
            <a routerLink="/player" class="
                    font-medium
                    transition-opacity
                    hover:opacity-70
                " style="color: var(--color-text)">
                Home
            </a>

            <a routerLink="/player/scores" class="
                    font-medium
                    transition-opacity
                    hover:opacity-70
                " style="color: var(--color-text)">
                Placares
            </a>
        </nav>

        <!-- Desktop Profile -->
        <div class="
                relative
                hidden
                md:block
            " (click)="stopPropagation($event)">
            <button (click)="toggleProfileMenu()" class="
                    flex
                    items-center
                    gap-3
                    rounded-full
                    transition-all
                    hover:scale-105
                    cursor-pointer
                ">

                <div class="
                        flex
                        h-11
                        w-11
                        items-center
                        justify-center
                        rounded-full
                        font-bold
                    " style="
                        background:
                        var(--color-primary);

                        color:
                        white;
                    ">
                    L
                </div>

                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    style="color: var(--color-text-muted)">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>

            </button>

            @if(profileMenuOpen()) {

            <div class="
                    absolute
                    right-0
                    mt-3
                    w-60
                    overflow-hidden
                    rounded-2xl
                    border
                    shadow-xl
                " style="
                    background:
                    var(--color-surface);

                    border-color:
                    var(--color-border);
                ">

                <div class="
                        border-b
                        p-4
                    " style="
                        border-color:
                        var(--color-border);
                    ">

                    <p class="font-semibold" style="
                            color:
                            var(--color-text);
                        ">
                        Lázaro
                    </p>

                    <p class="text-sm" style="
                            color:
                            var(--color-text-muted);
                        ">
                        Jogador
                    </p>

                </div>

                <a routerLink="/player/profile" class="
                        block
                        px-4
                        py-3
                        transition-colors
                        hover:bg-black/5
                    ">
                    Perfil
                </a>

                <a routerLink="/player/scores" class="
                        block
                        px-4
                        py-3
                        transition-colors
                        hover:bg-black/5
                    ">
                    Meus Placares
                </a>

                <div class="border-t" style="
                        border-color:
                        var(--color-border);
                    "></div>

                <button (click)="logout()" class="
                        w-full
                        px-4
                        py-3
                        text-left
                        font-medium
                        transition-colors
                        hover:bg-red-50
                    " style="
                        color:
                        var(--color-danger);
                    ">
                    Sair
                </button>
            </div>
            }
        </div>

        <!-- Mobile Button -->
        <button class="
                flex
                h-10
                w-10
                items-center
                justify-center
                rounded-xl
                md:hidden
            " (click)="toggleMenu()">
            ☰
        </button>

    </div>

    @if(mobileMenuOpen()) {

    <div class="
            fixed
            inset-0
            z-40
            bg-black/40
            md:hidden
        " (click)="closeMenu()"></div>

    <div class="
            fixed
            right-4
            top-20
            z-50
            w-72
            overflow-hidden
            rounded-2xl
            border
            shadow-2xl
            md:hidden
        " style="
            background:
            var(--color-surface);

            border-color:
            var(--color-border);
        ">

        <div class="
                border-b
                p-5
            " style="
                border-color:
                var(--color-border);
            ">

            <div class="
                    flex
                    items-center
                    gap-3
                ">

                <div class="
                        flex
                        h-12
                        w-12
                        items-center
                        justify-center
                        rounded-full
                        font-bold
                    " style="
                        background:
                        var(--color-primary);

                        color:
                        white;
                    ">
                    L
                </div>

                <div>
                    <p class="font-semibold" style="
                            color:
                            var(--color-text);
                        ">
                        Lázaro
                    </p>

                    <p class="text-sm" style="
                            color:
                            var(--color-text-muted);
                        ">
                        Jogador
                    </p>

                </div>

            </div>

        </div>

        <nav class="p-2">
            <a routerLink="/player" (click)="closeMenu()" class="
                    block
                    rounded-xl
                    px-4
                    py-3
                    hover:bg-black/5
                ">
                Home
            </a>

            <a routerLink="/player/profile" (click)="closeMenu()" class="
                    block
                    rounded-xl
                    px-4
                    py-3
                    hover:bg-black/5
                ">
                Perfil
            </a>

            <a routerLink="/player/scores" (click)="closeMenu()" class="
                    block
                    rounded-xl
                    px-4
                    py-3
                    hover:bg-black/5
                ">
                Meus Placares
            </a>

            <div class="my-2 border-t" style="
                    border-color:
                    var(--color-border);
                "></div>

            <button (click)="logout()" class="
                    w-full
                    rounded-xl
                    px-4
                    py-3
                    text-left
                    font-medium
                " style="
                    color:
                    var(--color-danger);
                ">
                Sair
            </button>
        </nav>
    </div>
    }
</header>
