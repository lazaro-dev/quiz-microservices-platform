<section class="overflow-hidden rounded-3xl border" style="
        background: var(--color-surface);
        border-color: var(--color-border);
    ">
    <img [src]="quiz.imageUrl" [alt]="quiz.title" class="h-64 w-full object-cover lg:h-80" />

    <div class="p-6 lg:p-8">
        <div class="flex flex-wrap gap-2">
            <span class="rounded-full px-3 py-1 text-sm" style="
                    background: rgba(79,70,229,.15);
                    color: var(--color-primary);
                ">
                {{ quiz.category }}
            </span>

            <span class="rounded-full px-3 py-1 text-sm" style="
                    background: rgba(220,38,38,.15);
                    color: var(--color-danger);
                ">
                Difícil
            </span>
        </div>

        <h1 class="mt-4 text-3xl font-black lg:text-5xl" style="color: var(--color-text);">
            {{ quiz.title }}
        </h1>

        <p class="mt-4 max-w-3xl text-lg" style="color: var(--color-text-muted);">
            {{ quiz.description }}
        </p>

        <app-quiz-stats class="mt-8 block" [questionsCount]="quiz.questionsCount" [totalPlays]="quiz.totalPlays"
            [averageScore]="quiz.averageScore" [estimatedDuration]="quiz.estimatedDuration" />

        <div class="mt-8 flex flex-col gap-3 sm:flex-row">
            <button class="rounded-xl px-6 py-4 font-semibold text-white" style="background: var(--color-primary);"
                (click)="startQuiz.emit()">
                Começar Quiz
            </button>

            <button class="rounded-xl border px-6 py-4" style="border-color: var(--color-border);"
                (click)="favorite.emit()">
                Favoritar
            </button>
        </div>

    </div>
</section>
