version: "3.9"

services:

  gateway:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - auth-service
      - user-service
      - quiz-service
      - realtime-service
    networks:
      - quiz-network
  
  auth-service:
    build:
      context: ./services/auth-service-go
      dockerfile: Dockerfile.dev
    volumes:
      - ./services/auth-service-go:/app
    ports:
      - "8081:8080"
    networks:
      - quiz-network
    environment:
        USER_SERVICE_URL: http://user-service:8080
        JWT_SECRET: 282356f935fffe4c3ec36e497253bbce296df4e6a28a00ff23fc3b164dae0933
        INTERNAL_API_KEY: 78db15c171745baa4c39fac59eba4117e76b3cab5446618ca2524866ccf03ce8

  user-service:
      build: 
        context: ./services/user-service-spring
        dockerfile: Dockerfile.dev
      ports:
        - "8082:8080"
      depends_on:
        postgres:
          condition: service_started
      networks:
        - quiz-network
      volumes:
        - ./services/user-service-spring:/app
        - ./services/user-service-spring/.m2:/root/.m2
      environment:
        JWT_SECRET: 282356f935fffe4c3ec36e497253bbce296df4e6a28a00ff23fc3b164dae0933
        INTERNAL_API_KEY: 78db15c171745baa4c39fac59eba4117e76b3cab5446618ca2524866ccf03ce8

  quiz-service:
    build:
      context: .
      dockerfile: services/quiz-service-laravel/Dockerfile.dev
    volumes:
      - ./services/quiz-service-laravel:/var/www
      - laravel-vendor:/var/www/vendor
      - laravel-storage:/var/www/storage
    ports:
      - "8083:8080"
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: admin
      JWT_SECRET: 282356f935fffe4c3ec36e497253bbce296df4e6a28a00ff23fc3b164dae0933
      INTERNAL_API_KEY: 78db15c171745baa4c39fac59eba4117e76b3cab5446618ca2524866ccf03ce8
    depends_on:
      postgres:
        condition: service_started
    command: php artisan serve --host=0.0.0.0 --port=8080
    networks:
      - quiz-network

  realtime-service:
    build:
      context: ./services/realtime-service-node
      dockerfile: Dockerfile.dev
    container_name: realtime-service
    restart: unless-stopped
    ports:
      - "8084:8080"
    volumes:
      - ./services/realtime-service-node:/app
      - /app/node_modules
    environment:
      PORT: 8080 
      REDIS_HOST: redis 
      REDIS_PORT: 6379
      REDIS_DB: 0
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      CHOKIDAR_USEPOLLING: "true"
      JWT_SECRET: 282356f935fffe4c3ec36e497253bbce296df4e6a28a00ff23fc3b164dae0933
    depends_on:
      rabbitmq: 
        condition: service_healthy 
      redis: 
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/realtime/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - quiz-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quiz-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: quiz
    ports:
      - "5432:5432"
    networks:
      - quiz-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    # entrypoint: ["sh", "/init.sh"]

  adminer:
    image: adminer
    ports:
      - "9090:8080"
    networks:
      - quiz-network
      
networks:
  quiz-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  laravel-vendor:
  laravel-storage: